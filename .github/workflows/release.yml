name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --locked --dev
      - run: uv run pytest -q tests/test_mcp_v2.py tests/test_solution_functions.py

      # Fail before publishing rather than after, if the tag and the version in
      # pyproject.toml disagree. PyPI never lets a version be re-uploaded.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi

      - run: uv build
      - run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this OIDC identity (repo + workflow +
    # environment) instead of an API token. Nothing secret lives in this repo.
    environment:
      name: pypi
      url: https://pypi.org/p/freshdesk-mcp-iplweb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
