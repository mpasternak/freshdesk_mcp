[project]
name = "freshdesk-mcp-iplweb"
version = "1.3.0"
description = "MCP server for Freshdesk (iplweb fork) - MCP Python SDK 2.x, extra CRUD, filtering and bulk-fetch tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "freshdesk", "helpdesk", "ticketing", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Customer Service",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx==0.28.1",
    "mcp==2.0.0",
    "pydantic>=2.12,<3",
]

[[project.authors]]
name = "Gopi Krishnan"
email = "gopi@effy.co.in"

[[project.authors]]
name = "Maanaesh Swamy"
email = "maanaesh.s@effy.co.in"

[[project.maintainers]]
name = "Michał Pasternak"
email = "michal.dtz@gmail.com"

[project.urls]
Homepage = "https://github.com/mpasternak/freshdesk_mcp"
Repository = "https://github.com/mpasternak/freshdesk_mcp"
Issues = "https://github.com/mpasternak/freshdesk_mcp/issues"
"Upstream project" = "https://github.com/effytech/freshdesk_mcp"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The distribution is named freshdesk-mcp-iplweb but the import package stays
# freshdesk_mcp, so hatchling cannot infer the source layout from the name.
[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_mcp"]

[project.scripts]
freshdesk-mcp-iplweb = "freshdesk_mcp.server:main"
freshdesk-mcp = "freshdesk_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
